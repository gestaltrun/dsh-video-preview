name: Release candidate package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified candidate package
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  package:
    if: github.repository == 'gestaltrun/dsh-video-preview'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      PUBLISH_PACKAGE: ${{ inputs.publish }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          cache: pnpm
      - name: Fetch exact Sidebar build input
        id: sidebar
        run: |
          mkdir -p "$RUNNER_TEMP/sidebar-input"
          npm pack @gestaltrun/dsh-better-sidebar@0.19.1-gestaltrun.0 --pack-destination "$RUNNER_TEMP/sidebar-input"
          echo "path=$RUNNER_TEMP/sidebar-input/gestaltrun-dsh-better-sidebar-0.19.1-gestaltrun.0.tgz" >> "$GITHUB_OUTPUT"
      - name: Build and verify candidate
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: >-
          pnpm run ${{ (github.event_name == 'release' || inputs.publish) && 'release:publish' || 'release:pack' }} --
          --out "$RUNNER_TEMP/dsh-video-preview"
          --sidebar-tarball "${{ steps.sidebar.outputs.path }}"
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-video-preview-candidate
          path: ${{ runner.temp }}/dsh-video-preview/*.tgz
          if-no-files-found: error
